<!DOCTYPE html>
<html>
<head>
	<title>Terraria Tracker Settings</title>
	<script src="index.js"></script>
	<link rel="stylesheet" type="text/css" href="index.css">
</head>
<body>
	<div class="header">
		Archipelago Configs
	</div>

	<div>
		<label>Hostname</label>
		<input type="text" id="AHOST" value="archipelago.gg" />
	</div>
	<div>
		<label>Port</label>
		<input type="text" id="APORT" />
	</div>
	<div>
		<label>Name</label>
		<input type="text" id="ANAME" />
	</div>
	<div>
		<label>Password</label>
		<input type="text" id="APASS" />
	</div>

	<div class="header">
		Randomizer Settings
	</div>
	<div>
		<label>Randomize Early Achievements</label>
		<select id="e">
			<option value="0">Exclude</option>
			<option value="" selected>Randomize</option>
		</select>
	</div>
	<div>
		<label>Randomize Normal Achievements</label>
		<select id="n">
			<option value="0">Exclude</option>
			<option value="" selected>Randomize</option>
		</select>
	</div>
	<div>
		<label>Randomize Grindy Achievements</label>
		<select id="g">
			<option value="" selected>Exclude</option>
			<option value="1">Randomize</option>
		</select>
	</div>
	<div>
		<label>Randomize Fishing Achievements</label>
		<select id="f">
			<option value="" selected>Exclude</option>
			<option value="1">Randomize</option>
		</select>
	</div>
	<div>
		<label>Play in getfixedboi</label>
		<select id="gfb">
			<option value="" selected>Vanilla</option>
			<option value="1">getfixedboi</option>
		</select>
	</div>
	<div>
		<label>Goal</label>
		<select id="t">
			<option value="0">Mechanical Bosses</option>
			<option value="1">Plantera</option>
			<option value="2">Golem</option>
			<option value="3">Empress of Light</option>
			<option value="4">Lunatic Cultist</option>
			<option value="" selected>Moon Lord</option>
			<option value="6">Zenith</option>
		</select>
	</div>
	

	<div class="header">
		Ready?
	</div>
	<div>
		<label>Let's Go</label>
		<button type="button" onclick="launch()">Launch</button>
	</div>

</body>
</html>
